<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผลการแข่งขันว่ายน้ำ  BlueHub</title>
    <!-- STREAMING_CHUNK: Loading Tailwind and PapaParse -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- STREAMING_CHUNK: Defining CSS Styles -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .splits-row { display: none; background-color: #fcfcfc; }
        .splits-row.active { display: table-row; }
        .chevron { transition: transform 0.2s ease-in-out; }
        .chevron.active { transform: rotate(180deg); }
    </style>
</head>
<body class="text-slate-800 p-2 md:p-6 min-h-screen">

    <div class="w-full max-w-[1400px] mx-auto space-y-6">
        
        <!-- STREAMING_CHUNK: Header with BlueHub Logo -->
        <header class="bg-white custom-shadow rounded-2xl p-6 border-t-4 border-blue-700 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-6">
                <!-- โลโก้ BlueHub -->
                <img src="BlueHub-Logo-Minimal.jpg" alt="BlueHub Logo" class="h-12 md:h-16 object-contain" onerror="this.src='https://placehold.co/200x60/ffffff/1e3a8a?text=BlueHub+Logo'">
                <div class="text-left border-l-2 border-slate-200 pl-6">
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">ระบบรายงานผลการแข่งขันว่ายน้ำ</h1>
                    <p class="text-slate-500 mt-1 text-sm md:text-base font-medium">Official Results Report (รายงานผลการแข่งขันอย่างเป็นทางการ)</p>
                </div>
            </div>
        </header>

        <!-- STREAMING_CHUNK: Control Panel (Upload & Filters) -->
        <div class="bg-white custom-shadow rounded-2xl p-5 border border-slate-100">
            <!-- ส่วนโหลดข้อมูล -->
            <div class="flex flex-col xl:flex-row gap-4 items-end xl:items-center pb-5 border-b border-slate-100 mb-5">
                <div class="w-full xl:w-2/3 flex flex-col md:flex-row gap-3 items-end">
                    <div class="flex-1 w-full">
                        <label class="text-xs font-semibold text-slate-600 mb-1 block uppercase tracking-wider">🔗 โหลดจาก Google Sheets (CSV Link)</label>
                        <div class="flex gap-2">
                            <input type="text" id="csv-url" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50" placeholder="วางลิงก์ CSV ที่นี่...">
                            <button id="load-url-btn" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">ดึงข้อมูล</button>
                        </div>
                    </div>
                    <div class="text-slate-400 text-sm font-medium px-2 py-2 hidden md:block">หรือ</div>
                    <div class="w-full md:w-auto">
                        <label class="text-xs font-semibold text-slate-600 mb-1 block uppercase tracking-wider">📂 อัปโหลดไฟล์ CSV</label>
                        <input type="file" id="csv-file" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-lg p-0.5 bg-slate-50">
                    </div>
                </div>
            </div>

            <!-- ส่วนตัวกรองข้อมูล (Filters) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="filters-area" style="opacity: 0.5; pointer-events: none;">
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block uppercase tracking-wider">🚻 เพศ (Gender)</label>
                    <select id="filter-gender" class="w-full rounded-lg border border-slate-300 p-2.5 bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="All">ทั้งหมด (All)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block uppercase tracking-wider">🎯 รุ่นอายุ (Age Group)</label>
                    <select id="filter-age" class="w-full rounded-lg border border-slate-300 p-2.5 bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="All">ทั้งหมด (All)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block uppercase tracking-wider">🏫 สโมสร (Club)</label>
                    <select id="filter-club" class="w-full rounded-lg border border-slate-300 p-2.5 bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="All">ทั้งหมด (All)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- STREAMING_CHUNK: Results Table Area -->
        <div id="results-container" class="bg-white custom-shadow rounded-2xl border border-slate-100 overflow-hidden" style="display: none;">
            
            <!-- ตารางผลการแข่งขัน -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-white text-sm tracking-wide">
                            <th class="px-6 py-4 font-semibold w-16 text-center">Rank</th>
                            <th class="px-6 py-4 font-semibold">Name - Surname</th>
                            <th class="px-6 py-4 font-semibold hidden md:table-cell">Gender</th>
                            <th class="px-6 py-4 font-semibold hidden sm:table-cell">Age Group</th>
                            <th class="px-6 py-4 font-semibold">Club</th>
                            <th class="px-6 py-4 font-semibold text-right">Final Time</th>
                            <th class="px-4 py-4 w-10"></th>
                        </tr>
                    </thead>
                    <tbody id="results-body" class="divide-y divide-slate-100 text-sm">
                        <!-- ข้อมูลจะถูกแทรกที่นี่ด้วย JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- กรณีไม่มีข้อมูลตรงกับ Filter -->
            <div id="no-data-msg" class="text-center py-12 text-slate-500 hidden">
                <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p>ไม่มีข้อมูลนักกีฬาที่ตรงกับตัวกรองที่คุณเลือก</p>
            </div>
        </div>

        <!-- หน้าจอต้อนรับ -->
        <div id="welcome-msg" class="text-center py-20">
            <h2 class="text-2xl font-bold text-slate-300 mb-2">อัปโหลดข้อมูลเพื่อดูผลการแข่งขัน</h2>
            <p class="text-slate-400">รองรับไฟล์ CSV ที่มีข้อมูล Split times (เช่น 50m, 100m)</p>
        </div>

    </div>

    <!-- STREAMING_CHUNK: Logic for Data Parsing and Table Rendering -->
    <script>
        let globalData = [];
        let filteredData = [];
        let distances = [];
        let finalDistance = '';

        // Helper: Time to Seconds for sorting
        function timeToSec(str) {
            if (!str || typeof str !== 'string') return null;
            let s = str.trim();
            if (s === "" || s === "-") return null;
            let p = s.split(':');
            return p.length === 2 ? parseInt(p[0]) * 60 + parseFloat(p[1]) : parseFloat(p[0]);
        }

        // Helper: Format Time strictly
        function formatTime(str) {
            if (!str) return "-";
            return str.trim();
        }

        // Element References
        const els = {
            urlInput: document.getElementById('csv-url'),
            loadBtn: document.getElementById('load-url-btn'),
            fileInput: document.getElementById('csv-file'),
            filtersArea: document.getElementById('filters-area'),
            filterGender: document.getElementById('filter-gender'),
            filterAge: document.getElementById('filter-age'),
            filterClub: document.getElementById('filter-club'),
            resultsContainer: document.getElementById('results-container'),
            resultsBody: document.getElementById('results-body'),
            welcomeMsg: document.getElementById('welcome-msg'),
            noDataMsg: document.getElementById('no-data-msg')
        };

        // Event Listeners for Uploading
        els.loadBtn.addEventListener('click', () => {
            const url = els.urlInput.value.trim();
            if (!url) return alert("กรุณาวางลิงก์ Google Sheets");
            let origTxt = els.loadBtn.innerText;
            els.loadBtn.innerText = "กำลังดึงข้อมูล...";
            Papa.parse(url, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => { els.loadBtn.innerText = origTxt; processData(res.data); },
                error: (err) => { els.loadBtn.innerText = origTxt; alert("Error: " + err.message); }
            });
        });

        els.fileInput.addEventListener('change', (e) => {
            if (!e.target.files[0]) return;
            Papa.parse(e.target.files[0], {
                header: true, skipEmptyLines: true,
                complete: (res) => { processData(res.data); }
            });
        });

        // Event Listeners for Filters
        els.filterGender.addEventListener('change', applyFilters);
        els.filterAge.addEventListener('change', applyFilters);
        els.filterClub.addEventListener('change', applyFilters);

        function processData(data) {
            if (data.length === 0) return alert("ไม่พบข้อมูลในไฟล์");

            let cols = Object.keys(data[0]);
            // ค้นหาคอลัมน์ที่เป็นระยะทาง
            distances = cols.filter(c => c.trim().match(/^\d+m$/i)).sort((a,b) => parseInt(a) - parseInt(b));
            if (distances.length === 0) return alert("ไม่พบคอลัมน์ระยะทาง (เช่น 50m, 100m)");
            finalDistance = distances[distances.length - 1];

            // ทำความสะอาดและจัดเตรียมข้อมูล
            globalData = data.map(row => {
                let p = { ...row };
                
                const nKey = cols.find(k => k.includes('ชื่อ') || k.toLowerCase().includes('name'));
                p['Name'] = nKey && row[nKey] ? row[nKey].trim() : 'Unknown';
                
                const gKey = cols.find(k => k.toLowerCase() === 'gender' || k === 'เพศ');
                p['Gender'] = gKey && row[gKey] ? row[gKey].trim() : '-';
                
                p['Age'] = row['รุ่นอายุ'] ? row['รุ่นอายุ'].trim() : (row['Age'] ? row['Age'].trim() : '-');
                
                const cKey = cols.find(k => k.toLowerCase() === 'สโมสร' || k.toLowerCase() === 'club');
                p['Club'] = cKey && row[cKey] ? row[cKey].trim() : '-';

                p['FinalTimeStr'] = row[finalDistance] || '-';
                p['FinalTimeSec'] = timeToSec(row[finalDistance]);
                
                const rankKey = cols.find(k => k.includes('อันดับ') || k.toLowerCase() === 'rank');
                p['RankOrig'] = rankKey && row[rankKey] ? row[rankKey].trim() : '';

                return p;
            });

            // Populate Filters
            populateDropdown(els.filterGender, 'Gender');
            populateDropdown(els.filterAge, 'Age');
            populateDropdown(els.filterClub, 'Club');

            els.filtersArea.style.opacity = "1";
            els.filtersArea.style.pointerEvents = "auto";
            els.welcomeMsg.style.display = "none";
            els.resultsContainer.style.display = "block";

            applyFilters();
        }

        function populateDropdown(selectElement, key) {
            let uniqueVals = [...new Set(globalData.map(d => d[key]))].filter(v => v !== '-' && v !== '').sort();
            selectElement.innerHTML = '<option value="All">ทั้งหมด (All)</option>';
            uniqueVals.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val;
                opt.innerText = val;
                selectElement.appendChild(opt);
            });
        }

        function applyFilters() {
            const selGender = els.filterGender.value;
            const selAge = els.filterAge.value;
            const selClub = els.filterClub.value;

            filteredData = globalData.filter(d => {
                let mG = selGender === 'All' || d['Gender'] === selGender;
                let mA = selAge === 'All' || d['Age'] === selAge;
                let mC = selClub === 'All' || d['Club'] === selClub;
                return mG && mA && mC;
            });

            // เรียงลำดับนักกีฬา
            filteredData.sort((a, b) => {
                // ถ้าเลือก "ทั้งหมด" ให้จัดกลุ่มตามอายุก่อน เพื่อให้อันดับ 1,2,3 ถูกคำนวณแยกตามรุ่นอายุ
                if (selAge === 'All') {
                    if (a.Age !== b.Age) return a.Age.localeCompare(b.Age);
                }
                // จากนั้นเรียงตามเวลา
                if (a.FinalTimeSec === null) return 1;
                if (b.FinalTimeSec === null) return -1;
                return a.FinalTimeSec - b.FinalTimeSec;
            });

            renderTable();
        }

        function renderTable() {
            els.resultsBody.innerHTML = '';

            if (filteredData.length === 0) {
                els.noDataMsg.style.display = 'block';
                return;
            } else {
                els.noDataMsg.style.display = 'none';
            }

            let currentAgeGroup = '';
            let currentCalculatedRank = 0;

            filteredData.forEach((swimmer, index) => {
                
                // คำนวณอันดับแยกตามกลุ่มอายุ (Reset อันดับเป็น 1 เมื่อเปลี่ยนกลุ่มอายุ)
                if (swimmer.Age !== currentAgeGroup) {
                    currentAgeGroup = swimmer.Age;
                    currentCalculatedRank = 1;
                } else {
                    currentCalculatedRank++;
                }

                // ใช้อันดับจากไฟล์ CSV ก่อน (ถ้ามี) ถ้าไม่มีให้ใช้อันดับที่คำนวณใหม่
                let actualRank = swimmer.RankOrig || currentCalculatedRank.toString();
                let rankNum = parseInt(actualRank);

                // ตั้งค่าสีสำหรับที่ 1, 2, 3
                let rowBgClass = "bg-white hover:bg-slate-50"; 
                let nameColorClass = "text-blue-800";
                let rankColorClass = "text-slate-700";
                let medalIcon = "";

                if (rankNum === 1) {
                    rowBgClass = "bg-[#FFFAF0] hover:bg-[#FEF3C7]"; // ทองอ่อน
                    nameColorClass = "text-[#B45309]"; // ตัวหนังสือสีทองเข้ม
                    rankColorClass = "text-[#B45309]";
                    medalIcon = "🥇 ";
                } else if (rankNum === 2) {
                    rowBgClass = "bg-[#F8FAFC] hover:bg-[#F1F5F9]"; // เงิน/เทาอ่อน
                    nameColorClass = "text-[#475569]"; // ตัวหนังสือสีเทาเข้ม
                    rankColorClass = "text-[#475569]";
                    medalIcon = "🥈 ";
                } else if (rankNum === 3) {
                    rowBgClass = "bg-[#FFF5F0] hover:bg-[#FFEDD5]"; // ทองแดง/ส้มอ่อน
                    nameColorClass = "text-[#C2410C]"; // ตัวหนังสือสีทองแดงเข้ม
                    rankColorClass = "text-[#C2410C]";
                    medalIcon = "🥉 ";
                }

                // แถวหลัก (Main Info Row)
                let mainRow = document.createElement('tr');
                mainRow.className = `group border-b border-slate-100 transition cursor-pointer ${rowBgClass}`;
                mainRow.innerHTML = `
                    <td class="px-6 py-4 font-bold text-center ${rankColorClass} text-base">${actualRank}</td>
                    <td class="px-6 py-4 font-semibold ${nameColorClass} text-base">${medalIcon}${swimmer.Name}</td>
                    <td class="px-6 py-4 text-slate-500 hidden md:table-cell">${swimmer.Gender}</td>
                    <td class="px-6 py-4 text-slate-500 hidden sm:table-cell">${swimmer.Age}</td>
                    <td class="px-6 py-4 text-slate-600 truncate max-w-[200px]" title="${swimmer.Club}">${swimmer.Club}</td>
                    <td class="px-6 py-4 font-bold text-right text-slate-800 font-mono text-base">${formatTime(swimmer.FinalTimeStr)}</td>
                    <td class="px-4 py-4 text-center">
                        <svg class="chevron w-5 h-5 text-slate-400 group-hover:text-blue-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </td>
                `;

                // แถวรายละเอียด Split Times (ซ่อนอยู่)
                let splitRow = document.createElement('tr');
                splitRow.className = "splits-row border-b-2 border-slate-200 shadow-inner";
                
                let splitsHtml = '<div class="p-6 bg-slate-50/80 rounded-b-lg"><div class="text-xs font-bold text-slate-400 uppercase mb-3 tracking-wider">Split Times / Lap Times</div><div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-y-4 gap-x-2">';
                
                distances.forEach(d => {
                    let splitTime = swimmer[d] && swimmer[d] !== "" ? swimmer[d] : "-";
                    splitsHtml += `
                        <div class="flex flex-col border-l-2 border-blue-200 pl-2">
                            <span class="text-[10px] text-slate-500 font-semibold uppercase">${d}</span>
                            <span class="text-sm font-mono font-medium text-slate-800">${splitTime}</span>
                        </div>
                    `;
                });
                splitsHtml += '</div></div>';
                
                splitRow.innerHTML = `<td colspan="7" class="p-0">${splitsHtml}</td>`;

                // ระบบกดแล้วกาง (Toggle Expand)
                mainRow.addEventListener('click', () => {
                    const isExpanded = splitRow.classList.contains('active');
                    
                    if (!isExpanded) {
                        splitRow.classList.add('active');
                        mainRow.querySelector('.chevron').classList.add('active');
                    } else {
                        splitRow.classList.remove('active');
                        mainRow.querySelector('.chevron').classList.remove('active');
                    }
                });

                els.resultsBody.appendChild(mainRow);
                els.resultsBody.appendChild(splitRow);
            });
        }
    </script>
</body>
</html>
```eof
