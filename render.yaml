services:
  - type: web
    name: bluehub
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bluehub-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
    healthCheckPath: /api/health

databases:
  - name: bluehub-db
    plan: starter
    databaseName: bluehub
    user: bluehub
